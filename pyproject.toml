[project]
name = "text-to-printer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # Core / Shared
    "google-genai",
    "paho-mqtt>=1.6.0",
    "numpy",
    # Online backend
    "fastapi",
    "uvicorn",
    # Telegram bot
    "python-telegram-bot>=20.0",
    # Bambu Cloud API
    "bambu-lab-cloud-api",
    # Camera snapshots
    "opencv-python>=4.0.0",
    # Mesh geometry validation
    "trimesh>=4.0.0",
    "scipy>=1.10.0",
    # Node.js environment for frontend
    "nodeenv",
    "requests>=2.34.2",
    "google-auth-oauthlib",
    "google-api-python-client",
    "google-auth-httplib2",
    "networkx>=3.4.2",
    "openai>=3.33.0",
    "anthropic>=1.15.0",
    "filelock>=4.1.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["outputs", ".venv", ".node_env", ".git", "node_modules"]
python_files = [
    "test_*.py",
]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "F841", "E712", "E741"]
